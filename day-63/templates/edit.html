<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
</head>
<body>
  <p> Book Name:  {{book.name}} </p>
  <p> Current Rating: {{book.rating}} </p>
  <form action="{{ url_for('edit', title=book.name) }}" method="POST">
        <input type="text" name="edit" placeholder="New Rating">
        <button type="submit">Change rating</button>
  </form>
</body>
</html>
