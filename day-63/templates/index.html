<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library</title>
</head>
<body>
<h1>My Library</h1>
    {% if books %}
    <ul>
        {% for book in books %}
            <li>
                {{ book.name }} - {{ book.author }} - {{book.rating}}
                <p>
                    <a href="{{url_for('edit', title = book.name)}}">Edit Rating</a>
                    <a href="{{url_for('delete', title = book.name)}}">Delete </a>
                </p>
            </li>
        {% endfor %}
    </ul>
    {% else %}
        <p>Library is empty.</p>
    {% endif %}

<a href="{{url_for('add')}}">Add New Book</a>
</body>
</html>
